name: Deploy to Azure App Service
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare database driver
        run: npm install --prefix "$RUNNER_TEMP/conta-runtime" --no-save --no-package-lock --ignore-scripts --omit=dev --no-audit --no-fund pg@8.23.1
      - name: Package application
        run: |
          zip -qr deploy.zip out server.js lib
          cd "$RUNNER_TEMP/conta-runtime"
          zip -qr "$GITHUB_WORKSPACE/deploy.zip" node_modules
      - uses: azure/webapps-deploy@v3
        with:
          app-name: aldoct
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
